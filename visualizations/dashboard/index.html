<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProjectHiddenThreads Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="header-top">
        <h1>ProjectHiddenThreads Local Archive Dashboard</h1>
        <div class="theme-switcher">
          <label for="theme-select">Theme</label>
          <select id="theme-select" aria-label="Dashboard theme">
            <option value="neon_ops">Neon Ops</option>
            <option value="black_ops">Black Ops</option>
            <option value="night_vision">Night Vision</option>
          </select>
        </div>
      </div>
      <p id="summary">Indexed records: 0</p>
    </header>

    <section class="breadcrumb-bar card" aria-label="Navigation breadcrumbs">
      <div id="breadcrumbs" class="breadcrumbs">
        <span class="breadcrumb-empty">No breadcrumb context yet.</span>
      </div>
      <button id="clear-breadcrumbs" class="ghost breadcrumb-clear">Clear</button>
    </section>

    <section class="insights-bar" id="insights-bar">
      <div class="insight-card compact">
        <h2>Parse Status</h2>
        <div id="parse-status" class="insight-list">Loading...</div>
      </div>
      <div class="insight-card compact">
        <h2>Top Extracted Entities</h2>
        <div id="top-entities" class="insight-list">Loading...</div>
      </div>
    </section>

    <section class="entity-browse-bar card">
      <h2>Entity Browse</h2>
      <div id="entity-browse" class="entity-browse-list">Loading...</div>
    </section>

    <main class="layout">
      <section class="card">
        <div class="filters">
          <div class="full">
            <label for="q">Search</label>
            <input id="q" type="search" placeholder="Search title, URL, rationale, or path" />
          </div>

          <div>
            <label for="kind">Kind</label>
            <select id="kind"></select>
          </div>

          <div>
            <label for="asset_type">Asset Type</label>
            <select id="asset_type"></select>
          </div>

          <div>
            <label for="status">Status</label>
            <select id="status"></select>
          </div>

          <div>
            <label for="source_domain">Source Domain</label>
            <select id="source_domain"></select>
          </div>

          <div>
            <label for="evidence_tier">Evidence Tier</label>
            <select id="evidence_tier"></select>
          </div>

          <div>
            <label for="discovered_from">Discovered From</label>
            <input id="discovered_from" type="date" />
          </div>

          <div>
            <label for="discovered_to">Discovered To</label>
            <input id="discovered_to" type="date" />
          </div>

          <div class="actions full">
            <button id="apply" class="primary">Apply Filters</button>
            <button id="reset" class="ghost">Reset</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Kind</th>
                <th>Asset Type</th>
                <th>Domain</th>
                <th>Status</th>
                <th>Tier</th>
                <th>Size</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>

        <div class="results-footer">
          <div id="page"></div>
          <div class="pager">
            <button id="prev">Previous</button>
            <button id="next">Next</button>
          </div>
        </div>
      </section>
    </main>

    <div id="preview-modal" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="preview-title">Preview</h2>
          <div class="modal-actions">
            <button id="open-tab" class="ghost">Open In New Tab</button>
            <button class="modal-close" id="modal-close">&times;</button>
          </div>
        </div>
        <div class="modal-body" id="preview">
          <div class="empty">Select any row to inspect content.</div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
